name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Build backend
        working-directory: ./backend
        run: chmod +x gradlew && ./gradlew clean bootJar --no-daemon

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: ./frontend
        run: npm ci && npm run build
        # Biến môi trường production lấy từ frontend/.env.production đã commit,
        # tránh inject secret rỗng đè lên giá trị đã cấu hình.

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Chuẩn hóa private key: nếu secret không chứa header PEM thì bọc lại
          KEY=$(printf '%s' "$SSH_KEY" | tr -d ' \t\r\n')
          if printf '%s' "$KEY" | grep -q 'BEGIN'; then
            printf '%s\n' "$KEY" > deploy_key
          else
            {
              echo '-----BEGIN OPENSSH PRIVATE KEY-----'
              printf '%s\n' "$KEY" | fold -w 64
              echo '-----END OPENSSH PRIVATE KEY-----'
            } > deploy_key
          fi
          chmod 600 deploy_key

      # SERVER_HOST là IP Tailscale (100.x.y.z) nên runner phải tham gia tailnet
      # trước khi SSH được tới server
      - name: Join Tailscale network
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: cinex-gh-runner

      # Ghi API key từ GitHub Secret vào .env trên server (không lộ key ra log/commit).
      # Nếu chưa cấu hình secret, bỏ qua và tính năng tương ứng sẽ trả lỗi 503 cho tới khi có key.
      - name: Sync API keys to server
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST || secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER || secrets.SSH_USERNAME }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "::warning::Chưa có GitHub Secret NVIDIA_API_KEY - box AI sẽ báo chưa cấu hình"
          fi
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::warning::Chưa có GitHub Secret YOUTUBE_API_KEY - tính năng trailer sẽ báo chưa cấu hình"
          fi
          for KEY_NAME in NVIDIA_API_KEY YOUTUBE_API_KEY MAIL_USERNAME MAIL_PASSWORD; do
            eval KEY_VALUE=\$$KEY_NAME
            if [ -n "$KEY_VALUE" ]; then
              ENCODED_KEY=$(printf '%s' "$KEY_VALUE" | base64 | tr -d '\n')
              ssh -i deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
                "cd /home/chunghoang/cinex && touch .env && sed -i '/^$KEY_NAME=/d' .env && printf '$KEY_NAME=' >> .env && printf '%s' '$ENCODED_KEY' | base64 -d >> .env && printf '\n' >> .env"
            fi
          done

      # SSH CLI thuần thay vì appleboy/ssh-action vì action đó chạy trong container
      # (key_path tương đối ở workspace không nhìn thấy được trong container)
      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST || secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER || secrets.SSH_USERNAME }}
        run: |
          ssh -i deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" 'bash -s' <<'EOF'
          set -e
          cd /home/chunghoang/cinex
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build
          docker image prune -f
          EOF

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ secrets.HEALTH_CHECK_URL || 'https://chung-ai.io.vn/actuator/health' }}" > /dev/null; then
              echo "Health check OK"
              exit 0
            fi
            echo "Retry $i/12: chờ backend khởi động..."
            sleep 10
          done
          exit 1
