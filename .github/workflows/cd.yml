name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Build backend
        working-directory: ./backend
        run: chmod +x gradlew && ./gradlew clean bootJar --no-daemon

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: ./frontend
        run: npm ci && npm run build
        # Biến môi trường production lấy từ frontend/.env.production đã commit,
        # tránh inject secret rỗng đè lên giá trị đã cấu hình.

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Chuẩn hóa private key: nếu secret không chứa header PEM thì bọc lại
          KEY=$(printf '%s' "$SSH_KEY" | tr -d ' \t\r\n')
          if printf '%s' "$KEY" | grep -q 'BEGIN'; then
            printf '%s\n' "$KEY" > deploy_key
          else
            {
              echo '-----BEGIN OPENSSH PRIVATE KEY-----'
              printf '%s\n' "$KEY" | fold -w 64
              echo '-----END OPENSSH PRIVATE KEY-----'
            } > deploy_key
          fi
          chmod 600 deploy_key

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.SSH_USERNAME }}
          key_path: deploy_key
          script: |
            cd /home/chunghoang/cinex
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ secrets.HEALTH_CHECK_URL || 'https://chung-ai.io.vn/actuator/health' }}" > /dev/null; then
              echo "Health check OK"
              exit 0
            fi
            echo "Retry $i/12: chờ backend khởi động..."
            sleep 10
          done
          exit 1
