# ===== Production Configuration =====

# Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate - repo chưa có hệ thống migration, để Hibernate tự tạo/ghép schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Flyway (Database Migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server
server.port=8080
server.compression.enabled=true
server.compression.min-response-size=1024

# Actuator (Health Check & Metrics)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# JWT & Auth
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:3600000}

# Logging
logging.level.root=WARN
logging.level.com.cinex=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=/var/log/cinex/application.log
logging.file.max-size=10MB
logging.file.max-history=30

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS (production)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://chung-ai.io.vn,https://www.chung-ai.io.vn}

# NVIDIA AI (NIM) - chat box + mô tả ảnh
app.nvidia.api-key=${NVIDIA_API_KEY:}
app.nvidia.model=${NVIDIA_MODEL:nvidia/nemotron-3.5-bolt-e4b}
app.nvidia.vision-model=${NVIDIA_VISION_MODEL:nvidia/nemotron-3.5-super-vl-120b-a12b}

# YouTube Data API v3 (trailer phim)
youtube.api-key=${YOUTUBE_API_KEY:}
youtube.base-url=https://www.googleapis.com/youtube/v3
youtube.enabled=true

# Tự động cập nhật suất chiếu: phủ 10 ngày tới, chu kỳ 5 ngày/lần (432000000 ms)
app.showtime.auto-days=10
app.showtime.refresh-interval-ms=432000000
app.showtime.initial-delay-ms=15000
