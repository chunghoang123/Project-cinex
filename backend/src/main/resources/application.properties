spring.application.name=cinex-cinema

# Datasource MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/cinex_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Londeocan1@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
app.jwt.secret=cinex-secret-key-change-in-production
app.jwt.expiration=86400000

# Google OAuth (đăng nhập Google, cấu hình qua biến môi trường GOOGLE_CLIENT_ID)
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}

# PayOS (cổng thanh toán). Cấu hình qua biến môi trường PAYOS_CLIENT_ID, PAYOS_API_KEY, PAYOS_CHECKSUM_KEY
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.base-url=https://api-merchant.payos.vn
payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/payment/return}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}

# TMDB API (kho phim: đang chiếu, sắp ra mắt, trailer)
tmdb.api-key=${TMDB_API_KEY:}
tmdb.base-url=https://api.themoviedb.org/3
tmdb.language=vi-VN
tmdb.region=VN
tmdb.auto-sync.enabled=false
tmdb.sync-cron=0 0 3 * * *

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.cinex=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
