spring.application.name=cinex-cinema

# Datasource MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/cinex_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Londeocan1@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
app.jwt.secret=cinex-secret-key-change-in-production
app.jwt.expiration=3600000

# SMTP Gmail (gửi mã OTP quên mật khẩu)
# MAIL_USERNAME/MAIL_PASSWORD chỉ cung cấp qua biến môi trường (.env / GitHub Secret), không commit
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Thời gian hiệu lực của mã OTP đặt lại mật khẩu (phút)
app.auth.otp-expire-minutes=5

# Đặt false để gửi email OTP thật qua SMTP; nếu true thì trả mã trực tiếp trong response (dev)
app.auth.expose-reset-token=false

# Google OAuth (đăng nhập Google, cấu hình qua biến môi trường GOOGLE_CLIENT_ID)
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}

# PayOS (cổng thanh toán). Cấu hình qua biến môi trường PAYOS_CLIENT_ID, PAYOS_API_KEY, PAYOS_CHECKSUM_KEY
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.base-url=https://api-merchant.payos.vn
payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/payment/return}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}

# TMDB API (kho phim: đang chiếu, sắp ra mắt, trailer)
tmdb.api-key=${TMDB_API_KEY:}
tmdb.base-url=https://api.themoviedb.org/3
tmdb.language=vi-VN
tmdb.region=VN
tmdb.auto-sync.enabled=false
tmdb.sync-cron=0 0 3 * * *

# YouTube Data API v3 (trailer phim) - cấu hình qua biến môi trường YOUTUBE_API_KEY
youtube.api-key=${YOUTUBE_API_KEY:}
youtube.base-url=https://www.googleapis.com/youtube/v3
youtube.enabled=true

# NVIDIA AI (NIM) - chat box + mô tả ảnh
app.nvidia.api-key=${NVIDIA_API_KEY:}
app.nvidia.model=${NVIDIA_MODEL:nvidia/nemotron-3.5-bolt-e4b}
app.nvidia.vision-model=${NVIDIA_VISION_MODEL:nvidia/nemotron-3.5-super-vl-120b-a12b}

# Tự động cập nhật suất chiếu: phủ 10 ngày tới, chu kỳ 5 ngày/lần (432000000 ms)
app.showtime.auto-days=10
app.showtime.refresh-interval-ms=432000000
app.showtime.initial-delay-ms=15000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.cinex=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
